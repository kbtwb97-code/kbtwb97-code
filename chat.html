<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
    }
    .header {
      background: #2196F3;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header-left h3 { font-size: 18px; }
    .header-left span { font-size: 12px; opacity: 0.8; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .hbtn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
    }
    .hbtn:hover { background: rgba(255,255,255,0.3); }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .msg-wrap.own { align-items: flex-end; }
    .bubble {
      max-width: 65%;
      padding: 10px 15px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      word-break: break-word;
      line-height: 1.4;
    }
    .msg-wrap.own .bubble {
      background: #2196F3;
      color: white;
    }
    .sender {
      font-size: 11px;
      font-weight: bold;
      color: #2196F3;
      margin-bottom: 3px;
    }
    .msg-wrap.own .sender { display: none; }
    .time {
      font-size: 11px;
      color: #aaa;
      margin-top: 3px;
      padding: 0 5px;
    }
    .input-row {
      display: flex;
      padding: 12px 15px;
      background: white;
      border-top: 1px solid #e0e0e0;
      gap: 10px;
      flex-shrink: 0;
    }
    .input-row input {
      flex: 1;
      padding: 11px 18px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
    }
    .input-row input:focus { border-color: #2196F3; }
    .send-btn {
      padding: 11px 22px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
    }
    .send-btn:hover { background: #1976D2; }
    .send-btn:disabled { background: #aaa; }
    .system-msg {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 5px;
    }
    #updateIndicator {
      position: fixed;
      top: 70px;
      right: 20px;
      background: #4CAF50;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h3>💬 Общий чат</h3>
    <span id="statusText">Подключение...</span>
  </div>
  <div class="header-right">
    <span id="userLabel" style="font-size:14px"></span>
    <a href="table-form.html" class="hbtn">📊 Таблица</a>
    <span id="adminLink"></span>
    <button class="hbtn" onclick="API.logout()">Выйти</button>
  </div>
</div>

<div id="updateIndicator">🔄 Новые сообщения</div>

<div class="chat-area" id="chatArea">
  <div class="system-msg">Загрузка сообщений...</div>
</div>

<div class="input-row">
  <input
    type="text"
    id="msgInput"
    placeholder="Напишите сообщение..."
    onkeypress="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMsg(); }"
    maxlength="1000"
  >
  <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
</div>

<script src="js/api.js"></script>

<script>
  // Проверка авторизации
  const user = requireAuth();
  if (!user) throw new Error('stop');

  // Показываем имя и кнопку админки
  document.getElementById('userLabel').textContent = '👤 ' + user.username;
  if (user.role === 'admin') {
    document.getElementById('adminLink').innerHTML =
      '<a href="admin.html" class="hbtn">⚙️ Админ</a>';
  }

  let lastCount = 0;
  let sending = false;

  // Форматирование времени
  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const h = d.getHours().toString().padStart(2, '0');
    const m = d.getMinutes().toString().padStart(2, '0');
    return h + ':' + m;
  }

  // Защита от XSS
  function safe(text) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(String(text)));
    return d.innerHTML;
  }

  // Отрисовка сообщений
  function renderMessages(messages) {
    const area = document.getElementById('chatArea');
    const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 80;

    if (messages.length === 0) {
      area.innerHTML = '<div class="system-msg">Сообщений пока нет. Напишите первым!</div>';
      return;
    }

    area.innerHTML = messages.map(msg => {
      const own = msg.userId === user.id;
      return `
        <div class="msg-wrap ${own ? 'own' : ''}">
          <div class="sender">${safe(msg.username)}</div>
          <div class="bubble">${safe(msg.text)}</div>
          <div class="time">${formatTime(msg.timestamp)}</div>
        </div>
      `;
    }).join('');

    if (atBottom || lastCount === 0) {
      area.scrollTop = area.scrollHeight;
    }
  }

  // Загрузка сообщений
  async function loadMessages() {
    const result = await API.getMessages(100);
    if (result.success) {
      if (result.messages.length !== lastCount) {
        // Есть новые сообщения
        if (lastCount > 0) {
          const ind = document.getElementById('updateIndicator');
          ind.style.display = 'block';
          setTimeout(() => ind.style.display = 'none', 2000);
        }
        lastCount = result.messages.length;
        renderMessages(result.messages);
      }
      document.getElementById('statusText').textContent =
        '🟢 Онлайн · ' + result.messages.length + ' сообщений';
    } else {
      document.getElementById('statusText').textContent = '🔴 Нет соединения';
    }
  }

  // Отправка сообщения
  async function sendMsg() {
    if (sending) return;
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    sending = true;
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    input.value = '';

    const result = await API.sendMessage(text);

    if (result.success) {
      await loadMessages();
    } else {
      alert('Ошибка отправки: ' + result.error);
      input.value = text; // возвращаем текст
    }

    btn.disabled = false;
    sending = false;
    input.focus();
  }

  // Запускаем
  loadMessages();
  // Обновляем каждые 3 секунды
  setInterval(loadMessages, 3000);
</script>

</body>
</html>
