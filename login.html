<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f2f5;
      margin: 0;
    }
    .box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      width: 380px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h2 { margin-bottom: 20px; color: #333; }
    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    input:focus { border-color: #2196F3; outline: none; }
    button {
      width: 100%;
      padding: 13px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover { background: #1976D2; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .msg {
      padding: 10px 14px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 14px;
      display: none;
    }
    .msg.show { display: block; }
    .error { background: #fde8e8; color: #c62828; }
    .success { background: #e8f5e9; color: #2e7d32; }
    .link { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
    .link a { color: #2196F3; text-decoration: none; }
  </style>
</head>
<body>

<div class="box">
  <h2>🔐 Вход</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Пароль">

  <div class="msg" id="msg"></div>

  <button id="btn" onclick="doLogin()">Войти</button>

  <div class="link">
    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
  </div>
</div>

<script src="js/api.js"></script>

<script>
  if (getSession()) window.location.href = 'chat.html';

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + type;
  }

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn');

    if (!email || !password) {
      showMsg('Заполните все поля!', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Вход...';

    const result = await API.login(email, password);

    if (result.success) {
      showMsg('✅ Добро пожаловать, ' + result.user.username + '!', 'success');
      setTimeout(() => window.location.href = 'chat.html', 1000);
    } else {
      showMsg('❌ ' + result.error, 'error');
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  }

  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doLogin();
  });
</script>

</body>
</html>
